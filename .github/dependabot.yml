version: 2
registries:
  github-npm:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.NPM_READ_TOKEN }}
updates:
  - package-ecosystem: npm
    directory: /apps/web
    registries: [github-npm]
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: Asia/Kolkata }
    groups:
      platform:
        patterns: ["@platform-sdk/*", "@platform-ui/*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@platform-sdk/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@platform-ui/*"
        update-types: ["version-update:semver-major"]
